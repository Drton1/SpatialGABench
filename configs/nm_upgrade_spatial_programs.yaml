schema_version: 1
gate: NM_UPGRADE
milestone: NU4_heldout_RNA_spatial_program_preservation
upgrade_protocol: protocols/NM_UPGRADE_EVIDENCE_PROTOCOL_2026-07-30.md
output_root: results/v1/nm_upgrade/nu4_spatial_programs

folds:
  count: 5
  coordinate_quantile_bins_per_axis: 5
  assignment_rule: (row_bin + 2 * column_bin) modulo 5
  minimum_test_observations: 100
  minimum_train_observations: 400

rna_programs:
  components: 10
  normalization: library_size_10000_log1p
  target_sum: 10000.0
  gene_biotype: protein_coding
  minimum_detected_training_fraction: 0.05
  minimum_eligible_training_genes: 500
  center_using_training_RNA_gene_means: true
  scale_genes: false
  svd_solver: randomized
  random_seed: 4160
  posthoc_component_selection: false
  posthoc_sign_alignment: false
  undefined_component_correlation: 0.0

spatial_metric:
  graph: symmetric_binary_knn
  neighbors: 8
  zero_variance_morans_i: 0.0
  primary_score_metric: heldout_component_spearman
  secondary_metrics:
    - heldout_component_pearson
    - absolute_morans_i_difference

aggregation:
  unit: fold_component
  within_contract_summary: median_across_5_folds_x_10_components
  control_delta_score: method_minus_representation_matched_control
  control_delta_morans_difference: control_minus_method
  bootstrap_draws_descriptive_only: 2000
  bootstrap_seed: 41023
  no_fold_or_component_independence_claim: true

methods:
  annotation:
    - promoter_only_2kb_pc
    - gene_body_pc
    - promoter_plus_gene_body_2kb_pc
    - distance_weighted_distal_250kb_decay50kb_pc
    - promoter_plus_distal_2kb_250kb_decay50kb_pc
  matched_control: accessibility_matched_random_peak_to_gene_control_pc
  software:
    - snapatac2_geneactivity
    - signac_geneactivity
    - archr_genescorematrix
  standard_representations:
    - macs3_summit_501bp
    - fixed_bin_10kb
    - fixed_bin_25kb
    - fixed_bin_50kb
  insertion_representation: insertion_derived_fixed_bin_25kb

