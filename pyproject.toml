[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialgabench"
version = "1.0.0.dev0"
description = "Representation-aware and leakage-free benchmark for spatial ATAC gene activity"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "anndata>=0.9",
  "h5py>=3.8",
  "igraph>=0.11,<0.12",
  "leidenalg>=0.10,<0.11",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "pysam>=0.22",
  "pyyaml>=6.0",
  "scanpy>=1.9",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "seaborn>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
workflow = [
  "snakemake>=7.32,<8; python_version < '3.11'",
  "snakemake>=9,<10; python_version >= '3.11'",
]

[project.scripts]
spatialgabench = "spatialgabench.cli.main:main"

[tool.setuptools.packages.find]
include = ["spatialgabench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
norecursedirs = ["archive", "environment", "data", "results"]
